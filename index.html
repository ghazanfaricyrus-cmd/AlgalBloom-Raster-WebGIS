<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Australia | September 2026 ΔMCI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  #map { background: #174b71; }
  .info { background: rgba(255,255,255,.96); padding: 11px 13px; border-radius: 6px;
    box-shadow: 0 1px 10px #0004; font: 13px/1.5 Arial,sans-serif; max-width: 270px; }
  .info img { display:block; max-width:245px; max-height:230px; margin: 7px 0; }
  .info small { color:#444; }
  /* Optional WFS usage note; never obscure the map with failure banners. */
  #waterStatus { position:absolute; z-index:1000; top:92px; left:10px;
    max-width:min(295px, calc(100vw - 75px)); box-sizing:border-box;
    background:rgba(255,255,255,.97); border-left:3px solid #008b80;
    border-radius:5px; padding:8px 10px; box-shadow:0 1px 8px #0003;
    font:12px/1.45 Arial,sans-serif; color:#243b40; }
  #waterStatus[hidden] { display:none !important; }
  /* Compact raster-loading guidance. Informational only; never blocks map controls. */
  #rasterLoading { position:absolute; z-index:1000; top:14px; left:50%;
    transform:translateX(-50%); box-sizing:border-box;
    width:max-content; max-width:min(360px, calc(100vw - 112px));
    display:flex; align-items:center; gap:10px; pointer-events:none;
    background:rgba(255,255,255,.96); color:#233845;
    border:1px solid rgba(43,84,105,.15); border-radius:10px;
    padding:9px 13px; box-shadow:0 3px 16px rgba(0,0,0,.16);
    font:12px/1.4 Arial,sans-serif; }
  #rasterLoading[hidden] { display:none !important; }
  #rasterLoading .loading-spinner { flex:none; width:15px; height:15px;
    border:2px solid #d2e3e9; border-top-color:#18768a; border-radius:50%;
    animation:raster-spin 1s linear infinite; }
  #rasterLoading strong { display:block; font-size:13px; font-weight:600; margin-bottom:2px; }
  #rasterLoading span { display:block; color:#526775; }
  @keyframes raster-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) {
    #rasterLoading .loading-spinner { animation:none; }
  }
  .leaflet-control-layers { font:13px/1.4 Arial,sans-serif; }
  .leaflet-control-layers-expanded { max-width:min(310px, calc(100vw - 30px));
    max-height: min(65vh, 420px); overflow-y:auto; }
  /* Responsive interface controls only: preserve raster rendering and WMS logic. */
  @media (max-width: 900px) {
    /* Keep the scale bar above the (potentially multi-line) attribution text. */
    .leaflet-bottom.leaflet-left { bottom: var(--mobile-attribution-height, 44px); }
    .leaflet-control-attribution { max-width: calc(100vw - 12px); box-sizing: border-box; }
  }
  /* Mobile/tablet legend display only; no raster, WMS or map changes. */
  .info.legend-responsive[hidden] { display: none !important; }
  .legend-toggle { display: none; }
  @media (max-width: 900px) {
    .info.legend-responsive { width: auto !important; max-width: min(300px, calc(100vw - 36px)) !important; padding: 8px 10px; box-sizing: border-box; }
    .legend-toggle { display: block; width: 100%; border: 0; background: transparent; text-align: left;
      padding: 3px 5px; cursor: pointer; color: #222; font: bold 14px/1.5 Arial,sans-serif; }
    .legend-content { display: none; }
    .legend-responsive.legend-open .legend-content { display: block; max-height: min(48vh, 350px); overflow-y: auto;
      overflow-x: hidden; overscroll-behavior: contain; margin-top: 6px; width: min(268px, calc(100vw - 58px)); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="waterStatus" role="status" aria-live="polite" hidden></div>
<div id="rasterLoading" role="status" aria-live="polite" hidden>
  <div class="loading-spinner" aria-hidden="true"></div>
  <div><strong>Loading ΔMCI map layer</strong>
    <span>This detailed raster may take 10 seconds or longer to fully appear.</span></div>
</div>
<script>
'use strict';
/*
  CLIENT-SIDE TEST COPY ONLY. No server, raster, SLD, or spatial-grid changes.
  Leaflet 1.9.4 reference: https://leafletjs.com/reference.html
  GeoServer WMS reference: https://docs.geoserver.org/latest/en/user/services/wms/reference/

  Retained from the original: public WMS URL, layer, scientific vik style,
  WMS 1.1.1, 256px image tiles, PNG transparency, opacity 1, map EPSG:3857,
  initial fitBounds, Esri basemap and legend GetLegendGraphic request.
  Only client-side scheduling, movement behavior and diagnostics are changed.
*/
const WMS_URL = 'https://map.gistrategix.com.au/algalbloom/wms';
const RASTER_LAYER = 'algalbloom:DeltaMCI_Sep_2026_WebGIS_Compressed';
const RASTER_STYLE = 'deltamci_vik_2026';
// Public, read-only HTTPS endpoint, resolved on the *same origin* as this page.
// Requests return only polygons intersecting the visible map.
const WFS_URL = '/algalbloom/wfs'; // Same-origin when served by map.gistrategix.com.au
const WATER_FEATURE_TYPE = 'algalbloom:dea_water_valid_polygons_20m';
// Generalised, lightweight overview is displayed at all scales; the exact 20 m
// WFS polygons are requested only for sufficiently close viewport extents.
const WATER_DETAIL_ZOOM = 9;
const WATER_OVERVIEW_URL = '/projects/algalbloom/stable_water_overview.geojson';
// Under the GeoServer layer's 1000-feature per-request limit. If hit, show
// a warning rather than silently depicting an incomplete water mask.
const WATER_MAX_FEATURES = 800;

// Conservative limit for this standalone diagnostic page (one-vCPU server).
// It caps image requests started by THIS WMS layer, not GeoServer-wide load.
// Fewer concurrent requests may improve reliability but may extend total load time.
const MAX_CONCURRENT_WMS = 3;

const map = L.map('map'); // Leaflet 1.9.4 default EPSG:3857, unchanged.
map.fitBounds([[-36.3, 136.0], [-32.0, 139.9]]);
// Keep blue valid-water polygons BELOW the scientific ΔMCI raster, so MCI
// colours remain faithful. The underlying satellite or street map stays below.
map.createPane('waterPane');
map.getPane('waterPane').style.zIndex = '230';
map.createPane('analysisRasterPane');
map.getPane('analysisRasterPane').style.zIndex = '250';
// Raster images are noninteractive; clicks pass through to water polygons.
map.getPane('analysisRasterPane').style.pointerEvents = 'none';

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri and its data providers', maxZoom: 19 }
).addTo(map);

// Esri Streets: conventional map, instead of OSM's volunteer tile servers.
// The OSM tile service blocks requests launched from file:// pages.
// This raster Esri Streets service is legacy; review migration before 2029.
const streets = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri and its data providers', maxZoom: 19 }
);

// Leaflet has no documented per-WMS-layer concurrency option in 1.9.4.
// Queue only this WMS layer's image requests; its built-in URL/grid calculation
// remains untouched, including GetMap BBOX and WMS output CRS.
const LimitedWMS = L.TileLayer.WMS.extend({
  initialize: function(url, options) {
    L.TileLayer.WMS.prototype.initialize.call(this, url, options);
    this._requestQueue = [];
    this._requestByTile = new Map();
    this._activeRequests = 0;
    this.on('tileunload tileabort', function(event) {
      this._cancelRequest(event.tile);
    }, this);
    this.on('remove', function() { this._cancelAllRequests(); }, this);
  },

  createTile: function(coords, done) {
    const img = document.createElement('img');
    img.alt = '';
    img.setAttribute('role', 'presentation');
    const request = { img, coords, done, started:false, finished:false };
    this._requestByTile.set(img, request);
    this._requestQueue.push(request);
    this._drainRequestQueue();
    return img;
  },

  _drainRequestQueue: function() {
    while (this._activeRequests < MAX_CONCURRENT_WMS && this._requestQueue.length) {
      const request = this._requestQueue.shift();
      if (request.finished) continue;
      request.started = true;
      this._activeRequests++;
      request.img.onload = () => this._finishRequest(request, null);
      request.img.onerror = () => this._finishRequest(request, new Error('WMS image load failed'));
      request.img.src = this.getTileUrl(request.coords);
    }
  },

  _finishRequest: function(request, error) {
    if (request.finished) return;
    request.finished = true;
    this._activeRequests = Math.max(0, this._activeRequests - 1);
    this._requestByTile.delete(request.img);
    request.img.onload = null;
    request.img.onerror = null;
    request.done(error, request.img); // Preserve Leaflet tileload / tileerror semantics.
    this._drainRequestQueue();
  },

  _cancelRequest: function(img) {
    const request = this._requestByTile.get(img);
    if (!request || request.finished) return;
    request.finished = true;
    this._requestByTile.delete(img);
    if (request.started) {
      img.onload = null;
      img.onerror = null;
      img.src = L.Util.emptyImageUrl; // Cancel an obsolete browser image fetch.
      this._activeRequests = Math.max(0, this._activeRequests - 1);
    } else {
      const index = this._requestQueue.indexOf(request);
      if (index !== -1) this._requestQueue.splice(index, 1);
    }
    // Leaflet has unloaded/aborted the tile: do not invoke done() for stale work.
    this._drainRequestQueue();
  },

  _cancelAllRequests: function() {
    // Empty queued work first, so cancelling active requests cannot start more.
    this._requestQueue.length = 0;
    for (const img of Array.from(this._requestByTile.keys())) {
      this._cancelRequest(img);
    }
  }
});

const raster = new LimitedWMS(WMS_URL, {
  pane: 'analysisRasterPane',
  layers: RASTER_LAYER,
  styles: RASTER_STYLE,
  format: 'image/png',
  transparent: true,
  version: '1.1.1',
  opacity: 1,
  tileSize: 256,              // Same default Leaflet tile grid as the original.
  updateWhenIdle: true,      // Defer new tile requests until a pan is finished.
  updateWhenZooming: false,  // Defer updates during smooth zoom animation.
  keepBuffer: 2,             // Keep default buffer: avoid needless re-requests.
  attribution: 'September 2026 Sentinel-2 ΔMCI · 2019–2023 September baseline'
});

// Full-blue coverage within the validated mask. The overlay pane sits BELOW
// the WMS: enabling stable water never paints over scientific ΔMCI colours.
const waterStyle = { pane:'waterPane', color:'#00d5ed', weight:1.15,
  opacity:0.92, fillColor:'#176e9c', fillOpacity:0.82 };
function bindWaterPopup(feature, layer, overview=false) {
  const popup = document.createElement('div');
  const name = document.createElement('strong');
  name.textContent = 'Sentinel-2 Stable Water Mask (2019–2023)';
  const desc = document.createElement('p');
  desc.style.margin = '6px 0 0';
  desc.textContent = overview
    ? 'Generalised overview of the valid-water analysis domain. Detailed 20 m boundaries appear at closer scales.'
    : 'Valid water-analysis domain (20 m). Not an algal bloom detection or a water-safety assessment.';
  popup.append(name,desc);
  layer.bindPopup(popup);
}
const waterOverview = L.geoJSON(null, {
  pane:'waterPane', style:waterStyle,
  onEachFeature:(feature, layer)=>bindWaterPopup(feature,layer,true)
});
const waterDetail = L.geoJSON(null, {
  pane:'waterPane', style:waterStyle,
  onEachFeature:(feature, layer)=>bindWaterPopup(feature,layer,false)
});
// Registered in the toggle control; OFF initially, like the previous test.
const waterPolygons = L.layerGroup([waterOverview]);

L.control.scale({position:'bottomleft',metric:true,imperial:false}).addTo(map);
const layerControl = L.control.layers(
  {'Esri Satellite':satellite, 'Esri Streets (non-satellite)':streets},
  {'September 2026 ΔMCI (vik)':raster,
   'Sentinel-2 Stable Water Mask (2019–2023)':waterPolygons},
  {position:'topright',collapsed:true}
).addTo(map);

// Closed by default on ALL screens. Click the layers icon to toggle it;
// do not automatically reveal the panel just by hovering on desktop.
const layersContainer = layerControl.getContainer();
L.DomEvent.off(layersContainer, 'mouseenter', layerControl._expandSafely, layerControl);
const layerToggle = layersContainer.querySelector('.leaflet-control-layers-toggle');
if (layerToggle) {
  layerToggle.setAttribute('aria-label','Show or hide map layers');
  layerToggle.setAttribute('aria-expanded','false');
  layerToggle.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopImmediatePropagation();
    const expanded = layersContainer.classList.contains('leaflet-control-layers-expanded');
    if (expanded) layerControl.collapse(); else layerControl.expand();
    layerToggle.setAttribute('aria-expanded',String(!expanded));
  }, true);
}
document.addEventListener('pointerdown', function(event) {
  if (!layersContainer.contains(event.target)) {
    layerControl.collapse();
    if (layerToggle) layerToggle.setAttribute('aria-expanded','false');
  }
}, {passive:true});

const waterStatus = document.getElementById('waterStatus');
let waterAbort = null;
let waterRequestVersion = 0;
let waterDebounce = null;
let overviewLoaded = false;
let overviewPromise = null;
function showWaterStatus(message) {
  waterStatus.textContent = message;
  waterStatus.hidden = !message;
}
function showGeneralisedOverview() {
  waterPolygons.removeLayer(waterDetail);
  if (!waterPolygons.hasLayer(waterOverview)) waterPolygons.addLayer(waterOverview);
}
async function loadWaterOverview() {
  if (overviewLoaded) return true;
  if (overviewPromise) return overviewPromise;
  overviewPromise = (async () => {
    try {
      const response = await fetch(WATER_OVERVIEW_URL, {credentials:'omit'});
      if (!response.ok) throw new Error('Overview HTTP '+response.status);
      const data = await response.json();
      if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) {
        throw new Error('Invalid water overview format');
      }
      waterOverview.clearLayers();
      waterOverview.addData(data);
      overviewLoaded = true;
      return true;
    } catch (error) {
      console.warn('Generalised water overview unavailable:', error);
      return false;
    } finally { overviewPromise = null; }
  })();
  return overviewPromise;
}
function cancelWaterRequest() {
  waterRequestVersion++;
  if (waterAbort) { waterAbort.abort(); waterAbort = null; }
  if (waterDebounce !== null) { clearTimeout(waterDebounce); waterDebounce = null; }
}
async function scheduleVisibleWater() {
  cancelWaterRequest();
  if (!map.hasLayer(waterPolygons)) {
    showWaterStatus('');
    return;
  }
  if (location.protocol === 'file:') {
    showWaterStatus('The water layer is available on the hosted WebGIS test page.');
    return;
  }
  const version = waterRequestVersion;
  showGeneralisedOverview();
  if (!overviewLoaded) showWaterStatus('Loading water mask…');
  const overviewReady = await loadWaterOverview();
  if (!map.hasLayer(waterPolygons) || version !== waterRequestVersion) return;
  if (map.getZoom() < WATER_DETAIL_ZOOM) {
    showWaterStatus(overviewReady ? '' : 'Water overview unavailable.');
    return;
  }
  if (!overviewReady) showWaterStatus('Loading detailed water boundaries…');
  // Debounce high-resolution WFS when moving/zooming. The lightweight overview
  // remains visible underneath until the detail request completes.
  waterDebounce = setTimeout(() => fetchVisibleWater(version), 350);
}
async function fetchVisibleWater(version) {
  waterDebounce = null;
  if (version !== waterRequestVersion || !map.hasLayer(waterPolygons)) return;
  const b = map.getBounds();
  const bbox = [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]
    .map(v=>v.toFixed(7)).join(',') + ',EPSG:4326';
  const params = new URLSearchParams({
    service:'WFS', version:'1.0.0', request:'GetFeature',
    typeName:WATER_FEATURE_TYPE, outputFormat:'application/json',
    srsName:'EPSG:4326', bbox, maxFeatures:String(WATER_MAX_FEATURES)
  });
  const controller = new AbortController();
  waterAbort = controller;
  try {
    const response = await fetch(WFS_URL + '?' + params.toString(),
      {method:'GET',signal:controller.signal,credentials:'omit'});
    if (!response.ok) throw new Error('HTTP '+response.status);
    const data = await response.json();
    if (version !== waterRequestVersion || !map.hasLayer(waterPolygons)) return;
    if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) {
      throw new Error('Unexpected WFS response');
    }
    if (data.features.length >= WATER_MAX_FEATURES) {
      // Never replace the complete overview with an arbitrarily truncated
      // WFS subset. The user still sees water, with fidelity limited by scale.
      showWaterStatus('Generalised water overview shown; zoom closer for 20 m detail.');
      return;
    }
    waterDetail.clearLayers();
    waterDetail.addData(data);
    waterPolygons.addLayer(waterDetail);
    waterPolygons.removeLayer(waterOverview);
    showWaterStatus('');
  } catch (error) {
    if (error.name === 'AbortError') return;
    if (version !== waterRequestVersion) return;
    console.warn('Stable-water WFS request failed:', error);
    // Keep overview visible; never expose technical stack traces to visitors.
    showWaterStatus('');
  } finally {
    if (waterAbort === controller) waterAbort = null;
  }
}
map.on('moveend', scheduleVisibleWater);
map.on('overlayadd', event => {
  if (event.layer === waterPolygons) scheduleVisibleWater();
});
map.on('overlayremove', event => {
  if (event.layer === waterPolygons) scheduleVisibleWater();
});

// The attribution can wrap to two or more lines on phones. Measure its actual
// height so the scale bar is never hidden behind its text; keep desktop intact.
const attributionElement = map.attributionControl.getContainer();
function placeScaleAboveAttribution() {
  const h = Math.ceil(attributionElement.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--mobile-attribution-height', `${h + 9}px`);
}
if ('ResizeObserver' in window) {
  new ResizeObserver(placeScaleAboveAttribution).observe(attributionElement);
}
window.addEventListener('resize', placeScaleAboveAttribution, {passive:true});
placeScaleAboveAttribution();

const legend = L.control({ position:'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div','info legend-responsive');
  div.style.width = '268px';
  div.style.maxWidth = 'calc(100vw - 35px)';
  div.style.boxSizing = 'border-box';

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'legend-toggle';
  toggle.setAttribute('aria-expanded', 'false');
  toggle.textContent = 'Legend ▾';
  toggle.addEventListener('click', function() {
    const open = div.classList.toggle('legend-open');
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? 'Legend ▴' : 'Legend ▾';
  });
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  const content = document.createElement('div');
  content.className = 'legend-content';

  const title = document.createElement('strong');
  title.textContent = 'September 2026 ΔMCI (vik)';

  // Exact 256 colour stops from the existing deltamci_vik_2026 SLD.
  // Legend only: the GeoServer WMS rendering and scientific values are unchanged.
  const bar = document.createElement('div');
  bar.setAttribute('role','img');
  bar.setAttribute('aria-label','ΔMCI vik colour scale: blue negative, neutral zero, red positive');

legend.addTo(map);
// This colour scale explains ΔMCI, so show it whenever the ΔMCI raster
// is enabled. Stable-water polygons may be enabled at the same time.
const rasterLegendElement = legend.getContainer();
function updateRasterLegendVisibility() {
  rasterLegendElement.hidden = !map.hasLayer(raster);
}
map.on('layeradd layerremove', function(event) {
  if (event.layer === raster) updateRasterLegendVisibility();
});
updateRasterLegendVisibility();

// Explain the delay only while Leaflet is loading the WMS tile batch.
// No artificial ten-second wait: dismiss as soon as the current view settles.
// A loading failure is not presented as a successful render.
const rasterLoading = document.getElementById('rasterLoading');
raster.on('loading', function() { rasterLoading.hidden = false; });
raster.on('load remove', function() { rasterLoading.hidden = true; });

// Keep diagnostic details in the developer console, not on the public map.
// Neither the WMS request parameters nor its raster rendering are changed.
raster.on('tileerror', function(event) {
  console.warn('ΔMCI WMS tile could not load:', event.tile.currentSrc || event.tile.src);
});

raster.addTo(map);
